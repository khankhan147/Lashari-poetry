<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lashari Poetry</title>
  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: sans-serif;
      padding: 30px 12px;
    }
    h1 { color: #ff4d6d; }
    .poetry {
      border: 1px solid #ff4d6d;
      padding: 20px;
      margin-top: 30px;
      border-radius: 15px;
      line-height: 2;
    }
  </style>
</head>
<body>
  <h1>❤️ Lashari Poetry ❤️</h1>
  <div class="poetry" dir="rtl">
    <h2>میری شاعری</h2>
    <p>دل کی بات لفظوں میں بیان کرتے ہیں</p>
    <p>ہم اپنی شاعری سے دلوں کو چھوتے ہیں</p>
  </div>
</body>
</html>
